<script>
  $(document).ready(function() {
    $('[data-filter]').click(function() {
      var filter = $(this).data('filter');

      $('[data-filter]').removeClass('active');
      $(this).addClass('active');

      if (filter === 'all') {
        $('.gallery-item').show();
      } else {
        $('.gallery-item').each(function() {
          if ($(this).data('category') === filter) {
            $(this).show();
          } else {
            $(this).hide();
          }
        });
      }
    });
  });
</script>
